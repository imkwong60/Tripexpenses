    const CATEGORIES = ['餐飲', '交通', '購物', '住宿', '門票', '其他'];

      { key: 'TWD', label: '台幣', symbol: 'NT$' },

    // ---------- helpers ----------
    const generateId = () => crypto.randomUUID?.() || Math.random().toString(36).slice(2, 11);
    const formatMoney = (n, symbol = 'HK$') => {
      const str = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n || 0);
      return `${symbol} ${str}`;
    };
    const today = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const formatEntryTime = (iso) => {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('zh-TW', {
          month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit',
          hour12: false
        });
      } catch { return ''; }
    };

    /** 預設每人 100% 參與 */
    const defaultShares = (memberList) => {
      const o = {};
      (memberList || []).forEach(m => { o[m] = 100; });
      return o;
    };

    /** 正規化 shares：數字 0–100，缺的視為 0 */
    const normalizeShares = (shares, memberList) => {
      const o = {};
      const src = shares && typeof shares === 'object' ? shares : {};
      (memberList || []).forEach(m => {
        const v = parseFloat(src[m]);
        o[m] = (isNaN(v) || v < 0) ? 0 : Math.min(100, v);
      });
      // 保留不在名單但有值的（舊資料）
      Object.keys(src).forEach(k => {
        if (o[k] === undefined) {
          const v = parseFloat(src[k]);
          o[k] = (isNaN(v) || v < 0) ? 0 : Math.min(100, v);
        }
      });
      return o;
    };

    function useLocalStorage(key, initial) {
      const [val, setVal] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : initial;
        } catch { return initial; }
      });
      const set = (v) => {
        setVal(prev => {
          const next = typeof v === 'function' ? v(prev) : v;
          try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
          return next;
        });
      };
      return [val, set];
    }

    // ---------- Icons ----------
    const Icons = {

      Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Chart: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
      Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>,
      Offline: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
      Share: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
      Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
      Receipt: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 3 2V2l-3 2-3-2-3 2-3-2-3 2-3-2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>,
      Loan: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      Chevron: ({ open }) => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`transition-transform ${open ? 'rotate-180' : ''}`}><polyline points="6 9 12 15 18 9"/></svg>,
      Image: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
    };

    // ---------- UI primitives ----------
    const Modal = ({ children, onClose }) => (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
           onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-zinc-200 dark:border-zinc-800 max-h-[90vh] overflow-y-auto">
          {children}
        </div>
      </div>
    );

    const Toast = ({ message, type = 'success', onClose }) => {
      useEffect(() => {
        const t = setTimeout(onClose, 2600);
        return () => clearTimeout(t);
      }, [onClose]);
      const bg = type === 'error' ? 'bg-red-500 text-white' : 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900';
      return (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60]">
          <div className={`${bg} px-5 py-2.5 rounded-full shadow-lg text-sm font-medium`}>{message}</div>
        </div>
      );
    };

    // ---------- Receipt: compress + upload ----------
    /** 上傳前壓縮：最長邊 1600px、JPEG 品質 0.72，約可壓到幾百 KB */
    const compressImage = (file, maxSide = 1600, quality = 0.72) => new Promise((resolve) => {
      if (!file || !file.type || !file.type.startsWith('image/')) {
        resolve(file);
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            if (!blob) { resolve(file); return; }
            const name = (file.name || 'receipt').replace(/\.[^.]+$/, '') + '.jpg';
            resolve(new File([blob], name, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        } catch (e) {
          URL.revokeObjectURL(url);
          resolve(file);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });

    const uploadReceipt = async (file, txId, oldPath = null) => {
      if (!sb || !file) return null;
      const compressed = await compressImage(file);
      // 每次用唯一路徑，避免瀏覽器／CDN 快取舊圖
      const path = `${FIXED_LEDGER_CODE}/${txId}_${Date.now()}.jpg`;
      const { error } = await sb.storage.from(RECEIPT_BUCKET).upload(path, compressed, {
        upsert: false,
        contentType: 'image/jpeg',
        cacheControl: '3600'
      });
      if (error) throw error;
      // 刪除舊檔（忽略失敗）
      if (oldPath && oldPath !== path && !oldPath.startsWith('http')) {
        try { await sb.storage.from(RECEIPT_BUCKET).remove([oldPath]); } catch (_) {}
      }
      const { data } = sb.storage.from(RECEIPT_BUCKET).getPublicUrl(path);
      const url = data?.publicUrl || null;
      return { path, url: url ? `${url}${url.includes('?') ? '&' : '?'}v=${Date.now()}` : null };
    };

    /** path + 可選 cache-bust（用 updated_at 或時間戳） */
    const receiptPublicUrl = (path, bust = null) => {
      if (!path) return null;
      let url = path;
      if (!path.startsWith('http')) {
        if (!sb) return null;
        const { data } = sb.storage.from(RECEIPT_BUCKET).getPublicUrl(path);
        url = data?.publicUrl || null;
      }
      if (!url) return null;
      if (bust) {
        const v = encodeURIComponent(String(bust));
        url = `${url}${url.includes('?') ? '&' : '?'}v=${v}`;
      }
      return url;
    };

    /** 刪除帳本下所有收據（清除帳目時用） */
    const deleteAllReceipts = async () => {
      if (!sb) return;
      try {
        const { data: files } = await sb.storage.from(RECEIPT_BUCKET).list(FIXED_LEDGER_CODE, { limit: 1000 });
        if (!files || !files.length) return;
        const paths = files.map(f => `${FIXED_LEDGER_CODE}/${f.name}`);
        // 分批刪除
        for (let i = 0; i < paths.length; i += 50) {
          await sb.storage.from(RECEIPT_BUCKET).remove(paths.slice(i, i + 50));
        }
      } catch (e) {
        console.warn('deleteAllReceipts', e);
      }
    };

    // ---------- Forms ----------
    const TxForm = ({ initial, members, travelCurrency, onSave, onClose }) => {
      const memberList = members.length ? members : ['自己'];
      const [form, setForm] = useState(() => {
        const base = initial || {
          amount: '', currency: travelCurrency || 'JPY', category: '餐飲',
          payer: memberList[0] || '', note: '', date: today(),
          shares: defaultShares(memberList),
          receipt_path: null
        };
        // 編輯／新增：成員參與預設全為 100%；若既有 shares 有值則沿用，缺的成員補 100
        const shares = defaultShares(memberList);
        if (initial?.shares && typeof initial.shares === 'object') {
          memberList.forEach(m => {
            const v = parseFloat(initial.shares[m]);
            if (!isNaN(v) && v >= 0) shares[m] = Math.min(100, v);
          });
        }
        return { ...base, shares, receiptFile: null, receiptPreview: receiptPublicUrl(base.receipt_path, base.updated_at || Date.now()) };
      });
      const amountRef = useRef(null);
      const [uploading, setUploading] = useState(false);

      useEffect(() => { amountRef.current?.focus(); }, []);

      const setShare = (name, val) => {
        setForm(f => ({
          ...f,
          shares: { ...f.shares, [name]: val }
        }));
      };

      const onFileChange = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) {
          alert('原始圖片請小於 15MB（上傳前會自動壓縮）');
          return;
        }
        setUploading(true);
        try {
          const compressed = await compressImage(file);
          const preview = URL.createObjectURL(compressed);
          setForm(f => ({ ...f, receiptFile: compressed, receiptPreview: preview }));
        } catch {
          const preview = URL.createObjectURL(file);
          setForm(f => ({ ...f, receiptFile: file, receiptPreview: preview }));
        }
        setUploading(false);
      };

      const clearReceipt = () => {
        setForm(f => ({ ...f, receiptFile: null, receiptPreview: null, receipt_path: null }));
      };

      const submit = async (e) => {
        e.preventDefault();
        const amt = parseFloat(String(form.amount).replace(/,/g, ''));
        if (!amt || amt <= 0) { alert('請輸入有效金額'); return; }
        if (!form.payer.trim()) { alert('請填寫付款人'); return; }
        const shares = normalizeShares(form.shares, memberList);
        const sumShare = Object.values(shares).reduce((s, v) => s + v, 0);
        if (sumShare <= 0) { alert('至少一位成員參與比例要大於 0'); return; }

        let receipt_path = form.receipt_path || null;
        const txId = initial?.id || generateId();

        if (form.receiptFile && sb) {
          setUploading(true);
          try {
            const up = await uploadReceipt(form.receiptFile, txId, form.receipt_path || initial?.receipt_path || null);
            receipt_path = up?.path || null;
          } catch (err) {
            console.warn('receipt upload', err);
            alert('收據上傳失敗，仍會儲存帳目（可之後再編輯補傳）');
          }
          setUploading(false);
        }

        onSave({
          ...form,
          id: txId,
          amount: Math.round(amt * 100) / 100,
          category: form.category || '其他',
          payer: form.payer.trim(),
          note: (form.note || '').trim(),
          date: form.date || today(),
          shares,
          receipt_path,
          created_at: initial?.created_at || nowISO(),
          updated_at: nowISO(),
          _pending: !navigator.onLine
        });
      };

      return (
        <Modal onClose={onClose}>

            setLoadingCloud(false);
            return;
          }
          try {
            const { data } = await sb.from('ledgers').select('name, home_currency').eq('code', FIXED_LEDGER_CODE).maybeSingle();
            if (cancelled) return;
            if (data) {
              if (data.name) setTripName(data.name);

              if (data.home_currency) setHomeCur(data.home_currency);
            } else {
              setTripName('家人旅遊');

            console.warn('welcome pull ledger', e);
            if (!cancelled) setTripName('家人旅遊');

      const [showMoreRates, setShowMoreRates] = useState(false);
      const composingRef = useRef(false);

      const addMember = () => {
        // 完全受控：只讀 memberInput；組字中不提交
        if (composingRef.current) return;
        const n = (memberInput || '').trim();
        if (!n) return;
        const exists = localMembers.some(m => m.toLowerCase() === n.toLowerCase());
        if (exists) {

                  {CURRENCIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}

                {(() => {

                  const home = local.homeCurrency || 'HKD';

                    if (!isBlur && (raw === '' || raw === '.' || raw === '-')) {
                      setLocal({ ...local, rates: { ...(local.rates || {}), [key]: raw } });
                      return;
                    }
                    const v = parseFloat(raw);
                    const final = isBlur
                      ? ((raw === '' || isNaN(v) || v <= 0) ? 1 : v)
                      : (isNaN(v) ? raw : v);
                    setLocal({ ...local, rates: { ...(local.rates || {}), [key]: final } });
                  };
                  const rateRow = (key) => {
                    const c = CURRENCIES.find(x => x.key === key);
                    const rateVal = (local.rates || {})[key];
                    const display = rateVal === undefined || rateVal === null ? '' : rateVal;

                          value={display}
                          onChange={e => setRate(key, e.target.value, false)}
