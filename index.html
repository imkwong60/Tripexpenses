              </div>
              <div>
                <label className="block text-sm font-medium mb-2">成員</label>
                <div className="flex flex-wrap gap-2 mb-2 min-h-[2rem]">
                  {localMembers.length === 0 && (
                    <span className="text-xs text-zinc-400">尚未新增成員</span>
                  )}
                  {localMembers.map(m => (
                    <span key={m} className="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800">
                      {m}
                      <button type="button" onClick={() => setLocalMembers(prev => prev.filter(x => x !== m))} className="text-zinc-400 hover:text-red-500 ml-0.5" aria-label={'移除 ' + m}>×</button>
                    </span>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input
                    value={memberInput}
                    onChange={e => setMemberInput(e.target.value)}
                    onCompositionStart={() => { composingRef.current = true; }}
                    onCompositionEnd={e => {
                      composingRef.current = false;
                      setMemberInput(e.target.value);
                    }}
                    placeholder="輸入名字後按新增"
                    className="flex-1 px-3 py-2 text-sm border border-zinc-300 dark:border-zinc-700 rounded-lg bg-white dark:bg-zinc-800"
                    onKeyDown={e => {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        // 組字確認鍵不要當成提交
                        if (e.nativeEvent.isComposing || composingRef.current) return;
                        addMember();
                      }
                    }}
                  />
                  <button type="button" onClick={addMember}
                    className="px-4 py-2 text-sm font-medium bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg shrink-0">
                    新增
                  </button>
                </div>
                <p className="text-[11px] text-zinc-400 mt-1">新增後請再按下方「儲存」才會同步給家人</p>
              </div>
            </div>
            <div className="flex justify-between items-center mt-8">
              <button type="button" onClick={onLeave} className="text-sm text-red-600 dark:text-red-400">清除所有帳目</button>
              <div className="flex gap-3">
                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-zinc-600">取消</button>
                <button type="button" onClick={() => onSave(local, localMembers)} className="px-5 py-2 text-sm font-medium bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg">儲存</button>
              </div>
            </div>
          </div>
        </Modal>
      );
    };

    // ---------- Mini pie ----------
    const MiniPie = ({ dataMap, title }) => {
      const data = useMemo(() => {
        const entries = Object.entries(dataMap || {}).filter(([, v]) => v > 0);
        const total = entries.reduce((s, [, v]) => s + v, 0);
        if (total === 0) return null;
        const sorted = entries.map(([name, value]) => ({ name, value, percent: (value / total) * 100 }))
          .sort((a, b) => b.value - a.value);
        let acc = 0;
        const gradient = sorted.map((item, i) => {
          const start = acc;
          acc += item.percent;
          return `${PIE_COLORS[i % PIE_COLORS.length]} ${start}% ${acc}%`;
        }).join(', ');
        return { sorted, total, gradient };
      }, [dataMap]);

      if (!data) return (
        <div className="py-8 text-center text-zinc-400 text-xs">{title}<br/>無資料</div>
      );
      return (
        <div className="flex flex-col items-center gap-3">
          <h4 className="text-xs font-semibold text-zinc-500">{title}</h4>
          <div className="pie-chart" style={{ '--pie-gradient': data.gradient }} />
          <div className="w-full space-y-1.5">
            {data.sorted.slice(0, 6).map((item, i) => (
              <div key={item.name} className="flex items-center gap-2 text-xs">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: PIE_COLORS[i % PIE_COLORS.length] }} />
                <span className="flex-1 truncate text-zinc-600 dark:text-zinc-400">{item.name}</span>
                <span className="font-mono text-zinc-800 dark:text-zinc-200">{item.percent.toFixed(0)}%</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ---------- Main App ----------
    function App() {
      const [theme, setTheme] = useLocalStorage('tl-theme', 'system');
      // 結算／總額顯示幣別：'home' 本國 | 'travel' 旅遊
      const [settleCurMode, setSettleCurMode] = useLocalStorage('tl-settle-cur', 'home');
      const [ledger, setLedger] = useLocalStorage('tl-ledger', null);
      const [members, setMembers] = useLocalStorage('tl-members', []);
      const [txs, setTxs] = useLocalStorage('tl-txs', []);
      const [loans, setLoans] = useLocalStorage('tl-loans', []);
      const [pendingQueue, setPendingQueue] = useLocalStorage('tl-pending', []);
      const [online, setOnline] = useState(navigator.onLine);
      const [syncing, setSyncing] = useState(false);
      const [statusText, setStatusText] = useState('');
      const [tab, setTab] = useState('list'); // list | stats | settle | loans
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [isLoanFormOpen, setIsLoanFormOpen] = useState(false);
      const [editingLoan, setEditingLoan] = useState(null);
      const [isWelcomeOpen, setIsWelcomeOpen] = useState(!ledger?.myName);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [filterCat, setFilterCat] = useState('all');
      const [showSettleSteps, setShowSettleSteps] = useState(false);
      const [previewReceipt, setPreviewReceipt] = useState(null);
      const TAB_ORDER = ['list', 'stats', 'settle', 'loans'];
      const touchStartRef = useRef(null);

      const onTouchStart = (e) => {
        if (isFormOpen || isSettingsOpen || isLoanFormOpen) return;
        const t = e.changedTouches?.[0] || e.touches?.[0];
        if (!t) return;
        touchStartRef.current = { x: t.clientX, y: t.clientY, t: Date.now() };
      };
      const onTouchEnd = (e) => {
        const start = touchStartRef.current;
        touchStartRef.current = null;
        if (!start || isFormOpen || isSettingsOpen || isLoanFormOpen) return;
        const t = e.changedTouches?.[0];
        if (!t) return;
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
        if (Date.now() - start.t > 600) return;
        const idx = TAB_ORDER.indexOf(tab);
        if (dx < 0 && idx < TAB_ORDER.length - 1) setTab(TAB_ORDER[idx + 1]);
        else if (dx > 0 && idx > 0) setTab(TAB_ORDER[idx - 1]);
      };

      useEffect(() => {
        if (ledger && ledger.code !== FIXED_LEDGER_CODE) {
          setLedger({ ...ledger, code: FIXED_LEDGER_CODE });
        }
      }, []);

      const showToast = (message, type = 'success') => setToast({ message, type });

      useEffect(() => {
        const root = document.documentElement;
        const preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = theme === 'dark' || (theme === 'system' && preferDark);
        root.classList.toggle('dark', dark);
      }, [theme]);

      useEffect(() => {
        const on = () => setOnline(true);
        const off = () => setOnline(false);
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);

      const convert = useCallback((amount, fromCur) => {
        if (!ledger) return amount;
        const home = ledger.homeCurrency || 'HKD';
        if (fromCur === home) return amount;
        const rate = (ledger.rates || {})[fromCur] ?? 1;
        return amount * rate;
      }, [ledger]);

      const homeSymbol = useMemo(() => {
        const c = CURRENCIES.find(x => x.key === (ledger?.homeCurrency || 'HKD'));
        return c?.symbol || 'HK$';
      }, [ledger]);

      const travelSymbol = useMemo(() => {
        const c = CURRENCIES.find(x => x.key === (ledger?.travelCurrency || 'JPY'));
        return c?.symbol || '¥';
      }, [ledger]);

      // 畫面顯示用：本國 or 旅遊貨幣
      const displaySymbol = settleCurMode === 'travel' ? travelSymbol : homeSymbol;
      const displayCurKey = settleCurMode === 'travel'
        ? (ledger?.travelCurrency || 'JPY')
        : (ledger?.homeCurrency || 'HKD');

      // 旅遊≠本國且匯率缺失／為 1 → 可能未正確設定
      const travelRateUnset = useMemo(() => {
        const travelKey = ledger?.travelCurrency || 'JPY';
        const homeKey = ledger?.homeCurrency || 'HKD';
        if (travelKey === homeKey) return false;
        const r = (ledger?.rates || {})[travelKey];
        if (r === undefined || r === null || r === '') return true;
        const n = parseFloat(r);
        return isNaN(n) || n <= 0 || n === 1;
      }, [ledger]);

      /** 任意幣別金額 → 目前顯示幣別（rates[travel] = 1 旅遊 = ? 本國） */
      const convertDisplay = useCallback((amount, fromCur) => {
        const homeAmt = convert(amount, fromCur);
        if (settleCurMode !== 'travel') return homeAmt;
        const travelKey = ledger?.travelCurrency || 'JPY';
        if (fromCur === travelKey) return amount;
        const rate = parseFloat((ledger?.rates || {})[travelKey]);
        const r = (!isNaN(rate) && rate > 0) ? rate : 1;
        return homeAmt / r;
      }, [convert, settleCurMode, ledger]);

      const mergeMembers = (a = [], b = []) => {
        const seen = new Set();
        const out = [];
        for (const name of [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])]) {
          const n = (name || '').trim();
          if (!n || seen.has(n)) continue;
          seen.add(n);
          out.push(n);
        }
        return out;
      };

      const applyLedgerRow = useCallback((row) => {
        if (!row) return;
        setLedger(prev => {
          if (!prev || !prev.myName) return prev;
          const nextRates = (row.rates && typeof row.rates === 'object') ? row.rates : (prev.rates || {});
          return {
            ...prev,
            tripName: row.name || prev.tripName,
            homeCurrency: row.home_currency || prev.homeCurrency || 'HKD',
            rates: nextRates,
            code: FIXED_LEDGER_CODE
          };
        });
        if (Array.isArray(row.members)) {
          setMembers(row.members);
        }
      }, [setLedger, setMembers]);

      const pullLedgerSettings = useCallback(async (code) => {
        if (!sb || !code) return;
        try {
          const { data, error } = await sb.from('ledgers').select('*').eq('code', code).maybeSingle();
          if (error) throw error;
          if (data) applyLedgerRow(data);
        } catch (e) {
          console.warn('pull ledger settings', e);
        }
      }, [applyLedgerRow]);

      const pushLedgerSettings = useCallback(async (settings, membersList) => {
        if (!sb || !settings) return false;
        const base = {
          code: FIXED_LEDGER_CODE,
          name: settings.tripName || '家人旅遊',
          home_currency: settings.homeCurrency || 'HKD',
          rates: settings.rates || {},
          updated_at: nowISO()
        };
        try {
          const payload = Array.isArray(membersList) ? { ...base, members: membersList } : base;
          const { error } = await sb.from('ledgers').upsert(payload);
          if (error) throw error;
          return true;
        } catch (e1) {
          console.warn('push ledger settings (with members) failed, retry without', e1);
          try {
            const { error } = await sb.from('ledgers').upsert(base);
            if (error) throw error;
            return true;
          } catch (e2) {
            console.warn('push ledger settings failed', e2);
            return false;
          }
        }
      }, []);

      const mapTxRow = (r) => ({
        id: r.id,
        amount: Number(r.amount),
        currency: r.currency,
        category: r.category,
        payer: r.payer,
        note: r.note || '',
        date: r.date,
        shares: (r.shares && typeof r.shares === 'object') ? r.shares : null,
        receipt_path: r.receipt_path || null,
        created_at: r.created_at,
        updated_at: r.updated_at
      });

      const mapLoanRow = (r) => ({
        id: r.id,
        amount: Number(r.amount),
        currency: r.currency,
        from_member: r.from_member,
        to_member: r.to_member,
        note: r.note || '',
        date: r.date,
        created_at: r.created_at,
        updated_at: r.updated_at
      });

      const pullFromCloud = useCallback(async (code, silent = false) => {
        if (!sb || !code) return;
        if (!silent) setSyncing(true);
        try {
          await pullLedgerSettings(code);
          const { data, error } = await sb
            .from('transactions')
            .select('*')
            .eq('ledger_code', code)
            .order('date', { ascending: false })
            .order('created_at', { ascending: false });
          if (error) throw error;
          if (Array.isArray(data)) {
            const mapped = data.map(mapTxRow);
            setTxs(mapped);
            const payers = mapped.map(t => t.payer).filter(Boolean);
            if (payers.length) setMembers(prev => mergeMembers(prev, payers));
            if (!silent) setStatusText('已同步 ' + data.length + ' 筆（含匯率）');
          }
          // loans
          try {
            const { data: loanData, error: loanErr } = await sb
              .from('loans')
              .select('*')
              .eq('ledger_code', code)
              .order('date', { ascending: false });
            if (!loanErr && Array.isArray(loanData)) {
              setLoans(loanData.map(mapLoanRow));
            }
          } catch (le) {
            console.warn('pull loans', le);
          }
        } catch (e) {
          console.warn(e);
          if (!silent) setStatusText('同步失敗（可離線使用）');
        } finally {
          if (!silent) setSyncing(false);
        }
      }, [setTxs, setLoans, pullLedgerSettings]);

      const flushPending = useCallback(async () => {
        if (!sb || !ledger?.code || !online || pendingQueue.length === 0) return;
        setSyncing(true);
        const remaining = [];
        for (const item of pendingQueue) {
          try {
            if (item.action === 'upsert') {
              const { error } = await sb.from('transactions').upsert({
                id: item.tx.id,
                ledger_code: ledger.code,
                amount: item.tx.amount,
                currency: item.tx.currency,
                category: item.tx.category,
                payer: item.tx.payer,
                note: item.tx.note || '',
                date: item.tx.date,
                shares: item.tx.shares || {},
                receipt_path: item.tx.receipt_path || null,
                created_at: item.tx.created_at,
                updated_at: nowISO()
              });
              if (error) throw error;
            } else if (item.action === 'delete') {
              const { error } = await sb.from('transactions').delete().eq('id', item.id).eq('ledger_code', ledger.code);
              if (error) throw error;
            } else if (item.action === 'upsert_loan') {
              const { error } = await sb.from('loans').upsert({
                id: item.loan.id,
                ledger_code: ledger.code,
                amount: item.loan.amount,
                currency: item.loan.currency,
                from_member: item.loan.from_member,
                to_member: item.loan.to_member,
                note: item.loan.note || '',
                date: item.loan.date,
                created_at: item.loan.created_at,
                updated_at: nowISO()
              });
              if (error) throw error;
            } else if (item.action === 'delete_loan') {
              const { error } = await sb.from('loans').delete().eq('id', item.id).eq('ledger_code', ledger.code);
              if (error) throw error;
            } else if (item.action === 'settings') {
              const ok = await pushLedgerSettings(item.settings, item.members);
              if (!ok) throw new Error('settings push failed');
            } else if (item.action === 'clear_ledger') {
              const code = ledger.code;
              await sb.from('transactions').delete().eq('ledger_code', code);
              try { await sb.from('loans').delete().eq('ledger_code', code); } catch (_) {}
              await deleteAllReceipts();
            }
          } catch (e) {
            remaining.push(item);
          }
        }
        setPendingQueue(remaining);
        if (remaining.length === 0) {
          await pullFromCloud(ledger.code);
          showToast('離線資料已上傳');
        }
        setSyncing(false);
      }, [sb, ledger, online, pendingQueue, setPendingQueue, pullFromCloud, pushLedgerSettings]);

      useEffect(() => {
        if (!ledger?.code || !sb) return;
        const code = ledger.code;
        let alive = true;

        const safePull = (silent = true) => {
          if (!alive || document.hidden) return;
          pullFromCloud(code, silent);
        };

        safePull(false);

        const channel = sb.channel('ledger-rt-' + code)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || row.ledger_code === code) safePull(true);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'ledgers' }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || row.code === code) {
              if (payload.new) applyLedgerRow(payload.new);
              else pullLedgerSettings(code);
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'loans' }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || row.ledger_code === code) safePull(true);
          })
          .subscribe((status) => {
            console.info('[Travel Ledger] realtime status:', status);
            if (status === 'SUBSCRIBED') {
              setStatusText('即時同步已連線');
              // Realtime 正常時放慢輪詢備援
              if (pollRef.current) clearInterval(pollRef.current);
              pollRef.current = setInterval(() => safePull(true), 30000);
            } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
              setStatusText('即時同步未就緒，改用定時更新');
              if (pollRef.current) clearInterval(pollRef.current);
              pollRef.current = setInterval(() => safePull(true), 5000);
            }
          });

        // 預設 5 秒輪詢；Realtime 連上後改 30 秒
        const pollRef = { current: setInterval(() => safePull(true), 5000) };
        const onVis = () => { if (!document.hidden) safePull(true); };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          alive = false;
          if (pollRef.current) clearInterval(pollRef.current);
          document.removeEventListener('visibilitychange', onVis);
          sb.removeChannel(channel);
        };
      }, [ledger?.code]);

      useEffect(() => {
        if (online) flushPending();
      }, [online]);

      const handleStart = async (myName, tripName, travelCurrency, homeCurrency) => {
        const baseLedger = {
          code: FIXED_LEDGER_CODE,
          tripName: tripName || '家人旅遊',
          travelCurrency: travelCurrency || 'JPY',
          homeCurrency: homeCurrency || 'HKD',
          rates: {},
          myName
        };
        setLedger(baseLedger);
        let startMembers = [myName];
        setMembers(prev => {
          const list = Array.isArray(prev) ? prev : [];
          startMembers = list.includes(myName) ? list : [...list, myName];
          return startMembers;
        });
        setIsWelcomeOpen(false);

        try {
          if (sb) {
            const { data } = await sb.from('ledgers').select('*').eq('code', FIXED_LEDGER_CODE).maybeSingle();
            if (data) {
              setLedger(prev => ({
                ...(prev || baseLedger),
                code: FIXED_LEDGER_CODE,
                myName: (prev && prev.myName) || myName,
                travelCurrency: (prev && prev.travelCurrency) || baseLedger.travelCurrency,
                tripName: data.name || (prev && prev.tripName) || baseLedger.tripName,
                homeCurrency: data.home_currency || (prev && prev.homeCurrency) || baseLedger.homeCurrency,
                rates: (data.rates && typeof data.rates === 'object') ? data.rates : ((prev && prev.rates) || {})
              }));
              const cloudMembers = Array.isArray(data.members) ? data.members : [];
              const merged = mergeMembers(cloudMembers, [myName]);
              setMembers(merged);
              if (!cloudMembers.includes(myName)) {
                await pushLedgerSettings({
                  tripName: data.name || baseLedger.tripName,
                  homeCurrency: data.home_currency || baseLedger.homeCurrency,
                  rates: (data.rates && typeof data.rates === 'object') ? data.rates : {}
                }, merged);
              }
            } else {
              await pushLedgerSettings(baseLedger, startMembers);
            }
            await pullFromCloud(FIXED_LEDGER_CODE);
          }
        } catch (e) {
          console.warn('handleStart sync', e);
        }
        showToast('已進入共用帳本');
      };

      const handleSaveSettings = async (s, m) => {
        const rawRates = s.rates || {};
        const cleanRates = {};
        Object.keys(rawRates).forEach(k => {
          const v = parseFloat(rawRates[k]);
          cleanRates[k] = (isNaN(v) || v <= 0) ? 1 : v;
        });
        const cleanMembers = mergeMembers(m || [], []);
        const next = {
          ...ledger,
          ...s,
          rates: cleanRates,
          code: FIXED_LEDGER_CODE,
          travelCurrency: s.travelCurrency || ledger.travelCurrency || 'JPY',
          myName: ledger.myName
        };
        setLedger(next);
        setMembers(cleanMembers);
        setIsSettingsOpen(false);
        if (!online || !sb) {
          setPendingQueue(prev => [
            ...prev.filter(p => p.action !== 'settings'),
            { action: 'settings', settings: next, members: cleanMembers }
          ]);
          showToast(online ? '設定已儲存（待同步）' : '本機已存；有網後會同步本國貨幣、匯率與成員');
          return;
        }
        const ok = await pushLedgerSettings(next, cleanMembers);
        showToast(ok ? '本國貨幣、匯率與成員已同步給家人' : '本機已存，雲端同步失敗', ok ? 'success' : 'error');
      };

      // 清除整個帳本的支出／借款／收據，保留成員、匯率、行程名稱、暱稱
      const handleClearLedger = async () => {
        const msg1 = '【第一次確認】\n將刪除本帳本「所有支出與私人借款」，並刪除雲端收據照片。\n成員名單、匯率、行程名稱會保留。\n\n確定要繼續？';
        if (!confirm(msg1)) return;
        const msg2 = '【第二次確認 · 無法復原】\n真的要清除所有項目與收據嗎？請再按一次確定。';
        if (!confirm(msg2)) return;

        const code = ledger?.code || FIXED_LEDGER_CODE;
        // 本機先清空
        setTxs([]);
        setLoans([]);
        setPendingQueue([]);
        setIsSettingsOpen(false);

        if (sb && online) {
          setSyncing(true);
          try {
            // 刪雲端交易
            await sb.from('transactions').delete().eq('ledger_code', code);
            // 刪雲端借款
            try { await sb.from('loans').delete().eq('ledger_code', code); } catch (e) { console.warn(e); }
            // 刪 Storage 收據
            await deleteAllReceipts();
            showToast('已清除所有帳目與收據');
          } catch (e) {
            console.warn('clear ledger cloud', e);
            showToast('本機已清除，雲端部分可能未完成', 'error');
          }
          setSyncing(false);
        } else {
          // 離線：排程刪除
          setPendingQueue([{ action: 'clear_ledger' }]);
          showToast('本機已清除；有網後會同步刪除雲端資料');
        }
      };

      const saveTx = async (tx) => {
        setTxs(prev => {
          const exists = prev.find(t => t.id === tx.id);
          if (exists) return prev.map(t => t.id === tx.id ? tx : t);
          return [tx, ...prev];
        });
        let nextMembers = members;
        {
          const extra = [tx.payer];
          if (tx.shares && typeof tx.shares === 'object') {
            Object.keys(tx.shares).forEach(k => extra.push(k));
          }
          const merged = mergeMembers(members, extra);
          if (merged.length !== members.length || merged.some((m, i) => m !== members[i])) {
            nextMembers = merged;
            setMembers(nextMembers);
          }
        }

        if (!online || !sb || !ledger?.code) {
          setPendingQueue(prev => {
            const q = [...prev.filter(p => !(p.action === 'upsert' && p.tx.id === tx.id)), { action: 'upsert', tx }];
            if (nextMembers !== members) {
              return [
                ...q.filter(p => p.action !== 'settings'),
                { action: 'settings', settings: ledger, members: nextMembers }
              ];
            }
            return q;
          });
          showToast(online ? '已儲存（待同步）' : '已離線暫存');
        } else {
          try {
            const { error } = await sb.from('transactions').upsert({
              id: tx.id,
              ledger_code: ledger.code,
              amount: tx.amount,
              currency: tx.currency,
              category: tx.category,
              payer: tx.payer,
              note: tx.note || '',
              date: tx.date,
              shares: tx.shares || {},
              receipt_path: tx.receipt_path || null,
              created_at: tx.created_at,
              updated_at: nowISO()
            });
            if (error) throw error;
            if (nextMembers !== members) {
              await pushLedgerSettings(ledger, nextMembers);
            }
            showToast('已儲存並同步');
          } catch (e) {
            setPendingQueue(prev => [...prev, { action: 'upsert', tx }]);
            showToast('已暫存，稍後再同步', 'error');
          }
        }
        setIsFormOpen(false);
        setEditingTx(null);
      };

      const deleteTx = async (id) => {
        if (!confirm('確定刪除此筆？')) return;
        setTxs(prev => prev.filter(t => t.id !== id));
        if (!online || !sb || !ledger?.code) {
          setPendingQueue(prev => [...prev, { action: 'delete', id }]);
        } else {
          try {
            await sb.from('transactions').delete().eq('id', id).eq('ledger_code', ledger.code);
            showToast('已刪除');
          } catch {
            setPendingQueue(prev => [...prev, { action: 'delete', id }]);
          }
        }
      };

      const saveLoan = async (loan) => {
        setLoans(prev => {
          const exists = prev.find(l => l.id === loan.id);
          if (exists) return prev.map(l => l.id === loan.id ? loan : l);
          return [loan, ...prev];
        });
        // 確保成員名單有這兩人
        const extra = [loan.from_member, loan.to_member].filter(Boolean);
        if (extra.length) setMembers(prev => mergeMembers(prev, extra));

        if (!online || !sb || !ledger?.code) {
          setPendingQueue(prev => [
            ...prev.filter(p => !(p.action === 'upsert_loan' && p.loan.id === loan.id)),
            { action: 'upsert_loan', loan }
          ]);
          showToast(online ? '借款已儲存（待同步）' : '已離線暫存');
        } else {
          try {
            const { error } = await sb.from('loans').upsert({
              id: loan.id,
              ledger_code: ledger.code,
              amount: loan.amount,
              currency: loan.currency,
              from_member: loan.from_member,
              to_member: loan.to_member,
              note: loan.note || '',
              date: loan.date,
              created_at: loan.created_at,
              updated_at: nowISO()
            });
            if (error) throw error;
            showToast('借款已儲存並同步');
          } catch (e) {
            setPendingQueue(prev => [...prev, { action: 'upsert_loan', loan }]);
            showToast('已暫存，稍後再同步', 'error');
          }
        }
        setIsLoanFormOpen(false);
        setEditingLoan(null);
      };

      const deleteLoan = async (id) => {
        if (!confirm('確定刪除此筆私人借款？')) return;
        setLoans(prev => prev.filter(l => l.id !== id));
        if (!online || !sb || !ledger?.code) {
          setPendingQueue(prev => [...prev, { action: 'delete_loan', id }]);
        } else {
          try {
            await sb.from('loans').delete().eq('id', id).eq('ledger_code', ledger.code);
            showToast('已刪除');
          } catch {
            setPendingQueue(prev => [...prev, { action: 'delete_loan', id }]);
          }
        }
      };

      // ---------- derived ----------
      const filtered = useMemo(() => {
        const list = filterCat === 'all' ? [...txs] : txs.filter(t => t.category === filterCat);
        return list.sort((a, b) => {
          const da = a.date || '';
          const db = b.date || '';
          if (da !== db) return db.localeCompare(da);
          const ca = a.created_at || a.updated_at || '';
          const cb = b.created_at || b.updated_at || '';
          return cb.localeCompare(ca);
        });
      }, [txs, filterCat]);

      const totalHome = useMemo(() =>
        txs.reduce((s, t) => s + convert(t.amount, t.currency), 0)
      , [txs, convert]);

      // 結算實際會計入的借款（雙方都是現有成員）
      const effectiveLoans = useMemo(() => {
        const set = new Set((members || []).map(m => String(m || '').trim()).filter(Boolean));
        return (loans || []).filter(l =>
          set.has(String(l.from_member || '').trim()) &&
          set.has(String(l.to_member || '').trim())
        );
      }, [loans, members]);
      const skippedLoanCount = Math.max(0, (loans || []).length - effectiveLoans.length);

      const byCategory = useMemo(() => {
        const m = {};
        txs.forEach(t => {
          m[t.category] = (m[t.category] || 0) + convert(t.amount, t.currency);
        });
        return m;
      }, [txs, convert]);

      const byPayer = useMemo(() => {
        const m = {};
        txs.forEach(t => {
          m[t.payer] = (m[t.payer] || 0) + convert(t.amount, t.currency);
        });
        return m;
      }, [txs, convert]);

      /**
       * 結算（含參與比例 + 私人借款）
       * paid[P]  = 實際代付總額
       * fair[P]  = 依 shares 應分攤總額
       * loanAdj  = 借款調整（借款人 −、出借人 +）
       * net[P]   = paid - fair + loanAdj  （>0 應收，<0 應付）
       * tableRows: 供「計算過程」表格用（成員為欄、項目為列）
       */
      const settlement = useMemo(() => {
        // 結算只計算「設定裡的現有成員」；已刪除的成員不再列入淨額／建議轉帳
        const people = [...new Set(
          (members || []).map(m => String(m || '').trim()).filter(Boolean)
        )];
        if (people.length === 0) {
          return { nets: [], transfers: [], tableRows: [], people: [], total: 0, orphanPaid: 0 };
        }
        const inCircle = (name) => people.includes(String(name || '').trim());
        // 已被移除但仍出現在舊帳的付款（僅作提示，不列入結算人名）
        let orphanPaid = 0;

        const paid = {};
        const fair = {};
        const loanAdj = {};
        people.forEach(p => { paid[p] = 0; fair[p] = 0; loanAdj[p] = 0; });

        const tableRows = []; // { label, cells: { [name]: number }, kind, note? }

        // 依日期升序顯示計算過程（由舊到新）
        const txsAsc = [...txs].sort((a, b) => {
          const da = a.date || '';
          const db = b.date || '';
          if (da !== db) return da.localeCompare(db);
          return (a.created_at || '').localeCompare(b.created_at || '');
        });

        txsAsc.forEach((t) => {
          const amtHome = convert(t.amount, t.currency);
          const payer = String(t.payer || '').trim();
          if (inCircle(payer)) {
            paid[payer] = (paid[payer] || 0) + amtHome;
          } else if (payer) {
            orphanPaid += amtHome;
          }

          // 只對「現有成員」算參與比例；已刪除成員的舊 shares 一律忽略
          let shares;
          if (t.shares && typeof t.shares === 'object' && Object.keys(t.shares).length) {
            shares = {};
            people.forEach(m => {
              if (!(m in t.shares) || t.shares[m] === '' || t.shares[m] === null || t.shares[m] === undefined) {
                // 該筆有寫 shares、但沒寫到這個現有成員 → 視為未參與
                shares[m] = 0;
              } else {
                const v = parseFloat(t.shares[m]);
                shares[m] = (isNaN(v) || v < 0) ? 0 : Math.min(100, v);
              }
            });
          } else {
            shares = defaultShares(people);
          }

          const active = Object.entries(shares).filter(([, v]) => v > 0);
          const sumShare = active.reduce((s, [, v]) => s + v, 0);
          const cells = {};
          people.forEach(p => { cells[p] = 0; });

          if (sumShare <= 0) {
            const n = people.length || 1;
            people.forEach(p => {
              const shareAmt = amtHome / n;
              fair[p] = (fair[p] || 0) + shareAmt;
              cells[p] = shareAmt;
            });
          } else {
            active.forEach(([name, pct]) => {
              if (!inCircle(name)) return;
              const shareAmt = amtHome * (pct / sumShare);
              fair[name] = (fair[name] || 0) + shareAmt;
              cells[name] = shareAmt;
            });
          }

          const noteBits = [];
          if (t.note) noteBits.push(t.note);
          noteBits.push(`付：${payer || '—'}${inCircle(payer) ? '' : '（已非成員）'}`);
          const zeroPeople = people.filter(p => !(shares[p] > 0));
          if (zeroPeople.length) noteBits.push(`未參與：${zeroPeople.join('、')}`);

          tableRows.push({
            kind: 'tx',
            label: `${t.date || ''} ${t.category}`,
            sub: noteBits.join(' · '),
            amount: amtHome,
            cells
          });
        });

        // 借款：只處理雙方都仍在成員名單內的
        loans.forEach(l => {
          const from = String(l.from_member || '').trim();
          const to = String(l.to_member || '').trim();
          if (!inCircle(from) || !inCircle(to)) return;
          const amtHome = convert(l.amount, l.currency);
          loanAdj[from] = (loanAdj[from] || 0) - amtHome;
          loanAdj[to] = (loanAdj[to] || 0) + amtHome;
          const cells = {};
          people.forEach(p => { cells[p] = 0; });
          cells[from] = -amtHome;
          cells[to] = amtHome;
          tableRows.push({
            kind: 'loan',
            label: `借款 ${from}→${to}`,
            sub: l.note || l.date || '',
            amount: amtHome,
            cells
          });
        });

        const nets = people.map(p => {
          const pPaid = paid[p] || 0;
          const pFair = fair[p] || 0;
          const pLoan = loanAdj[p] || 0;
          const net = pPaid - pFair + pLoan;
          return { name: p, paid: pPaid, fair: pFair, loanAdj: pLoan, net };
        }).sort((a, b) => a.net - b.net);

        // 摘要列
        const paidCells = {}, fairCells = {}, loanCells = {}, netCells = {};
        people.forEach(p => {
          paidCells[p] = paid[p] || 0;
          fairCells[p] = fair[p] || 0;
          loanCells[p] = loanAdj[p] || 0;
          netCells[p] = (paid[p] || 0) - (fair[p] || 0) + (loanAdj[p] || 0);
        });
        tableRows.push({ kind: 'sum', label: '已付合計', cells: paidCells });
        tableRows.push({ kind: 'sum', label: '應分攤合計', cells: fairCells });
        if (loans.length) tableRows.push({ kind: 'sum', label: '借款調整', cells: loanCells });
        tableRows.push({ kind: 'net', label: '淨額（應收+/應付−）', cells: netCells });

        // transfers：精準到分，確保每位有淨額的成員都會出現在建議轉帳
        const round2 = (x) => Math.round((x || 0) * 100) / 100;
        const debtors = nets
          .filter(n => round2(n.net) < -0.009)
          .map(n => ({ name: n.name, net: round2(n.net) }))
          .sort((a, b) => a.net - b.net);
        const creditors = nets
          .filter(n => round2(n.net) > 0.009)
          .map(n => ({ name: n.name, net: round2(n.net) }))
          .sort((a, b) => b.net - a.net);
        const transfers = [];
        let di = 0, ci = 0;
        // 安全上限避免異常迴圈
        let guard = 0;
        while (di < debtors.length && ci < creditors.length && guard < 500) {
          guard++;
          const d = debtors[di];
          const c = creditors[ci];
          const amount = round2(Math.min(-d.net, c.net));
          if (amount >= 0.01) {
            transfers.push({ from: d.name, to: c.name, amount });
            d.net = round2(d.net + amount);
            c.net = round2(c.net - amount);
          }
          if (Math.abs(d.net) < 0.01) di++;
          if (Math.abs(c.net) < 0.01) ci++;
        }

        return { nets, transfers, tableRows, people, total: totalHome, paid, fair, loanAdj, orphanPaid };
      }, [members, txs, loans, convert, homeSymbol, totalHome]);

      // ---------- render ----------
      if (!ledger?.myName || isWelcomeOpen) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 safe-header">
            <div className="text-5xl mb-4">✈️</div>
            <h1 className="text-2xl font-bold mb-2">旅遊本本</h1>
            <p className="text-zinc-500 text-center text-sm mb-8 max-w-xs">
              全家人打開同一個網址即可即時同步記帳，不必輸入代碼。支援離線暫存。
            </p>
            <WelcomeModal onStart={handleStart} />
            {toast && <Toast {...toast} onClose={() => setToast(null)} />}
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-28">
          <header className="safe-header sticky top-0 z-30 bg-zinc-50/90 dark:bg-zinc-950/90 backdrop-blur border-b border-zinc-200 dark:border-zinc-800">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div className="min-w-0">
                <h1 className="font-bold text-lg truncate">{ledger.tripName || '旅遊帳本'}</h1>
                <div className="flex items-center gap-2 text-xs text-zinc-500 mt-0.5">
                  <span className="text-zinc-500">你好，{ledger.myName}</span>
                  <span className="text-zinc-300 dark:text-zinc-600">·</span>
                  {online ? (
                    <span className="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400" title="在線 · 共用同步中">
                      <span className="relative flex h-2 w-2">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </span>
                      在線
                    </span>
                  ) : (
                    <span className="flex items-center gap-1.5 text-amber-600" title="離線">
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                      離線
                    </span>
                  )}
                  {pendingQueue.length > 0 && <span className="text-amber-600">· {pendingQueue.length} 筆待傳</span>}
                </div>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <div className="flex flex-col items-end gap-0.5">
                  <div className="flex items-center rounded-full border border-zinc-200 dark:border-zinc-700 p-0.5 text-[11px]">
                    <button type="button" onClick={() => setSettleCurMode('home')}
                      className={`px-2 py-1 rounded-full transition-colors ${settleCurMode === 'home' ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'text-zinc-500'}`}
                      title="以本國貨幣顯示結算">
                      {CURRENCIES.find(c => c.key === (ledger.homeCurrency || 'HKD'))?.label || '本國'}
                    </button>
                    <button type="button" onClick={() => setSettleCurMode('travel')}
                      className={`px-2 py-1 rounded-full transition-colors ${settleCurMode === 'travel' ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'text-zinc-500'}`}
                      title="以旅遊貨幣顯示結算">
                      {CURRENCIES.find(c => c.key === (ledger.travelCurrency || 'JPY'))?.label || '旅遊'}
                    </button>
                  </div>
                  {settleCurMode === 'travel' && travelRateUnset && (
                    <span className="text-[9px] text-amber-600 dark:text-amber-400 leading-none">匯率未設定，數字可能不準</span>
                  )}
                </div>
                <button onClick={() => pullFromCloud(ledger.code)} disabled={syncing}
                  className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" title="重新同步" aria-label="重新同步">
                  <Icons.Refresh />
                </button>
                <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                  className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" aria-label="切換主題">
                  {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
                </button>
                <button onClick={() => setIsSettingsOpen(true)}
                  className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" aria-label="設定">
                  <Icons.Settings />
                </button>
              </div>
            </div>
            <div className="max-w-lg mx-auto px-4 flex gap-1 pb-2">
              {[
                { key: 'list', label: '明細' },
                { key: 'stats', label: '統計' },
                { key: 'settle', label: '結算' },
                { key: 'loans', label: '借款' },
              ].map(t => (
                <button key={t.key} onClick={() => setTab(t.key)}
                  className={`flex-1 py-1.5 text-sm font-medium rounded-lg transition-colors ${tab === t.key ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pt-4"
            onTouchStart={onTouchStart}
            onTouchEnd={onTouchEnd}>
            <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-4 mb-4 shadow-sm">
              <div className="text-xs text-zinc-500 mb-1">本趟總花費（{settleCurMode === 'travel' ? '旅遊貨幣' : '本國貨幣'}）</div>
              <div className="text-2xl font-bold font-mono tracking-tight">{formatMoney(
                settleCurMode === 'travel' ? convertDisplay(totalHome, ledger.homeCurrency || 'HKD') : totalHome,
                displaySymbol
              )}</div>
              <div className="text-xs text-zinc-400 mt-1">共 {txs.length} 筆 · {members.length || Object.keys(byPayer).length} 人{effectiveLoans.length > 0 ? ` · ${effectiveLoans.length} 筆借款` : ''}{skippedLoanCount > 0 ? `（另 ${skippedLoanCount} 筆因非成員未計入）` : ''}</div>
            </div>

            {tab === 'list' && (
              <>
                <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-2 mb-2">
                  <button onClick={() => setFilterCat('all')}
                    className={`shrink-0 text-xs px-3 py-1 rounded-full ${filterCat === 'all' ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600'}`}>全部</button>
                  {CATEGORIES.map(c => (
                    <button key={c} onClick={() => setFilterCat(c)}
                      className={`shrink-0 text-xs px-3 py-1 rounded-full ${filterCat === c ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600'}`}>{c}</button>
                  ))}
                </div>
                {filtered.length === 0 ? (
                  <div className="py-16 text-center text-zinc-400">
                    <p className="text-sm">目前沒有紀錄</p>
                    <p className="text-xs mt-1">點擊右下角按鈕新增第一筆</p>
                  </div>
                ) : (
                  <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 divide-y divide-zinc-100 dark:divide-zinc-800 overflow-hidden">
                    {filtered.map(tx => {
                      const cur = CURRENCIES.find(c => c.key === tx.currency);
                      const shares = tx.shares && typeof tx.shares === 'object' ? tx.shares : null;
                      // 0% → 未參與；0 < x < 100 → 顯示參與 x%；100% 不顯示
                      const nonParticipants = [];
                      const partialParticipants = [];
                      if (shares) {
                        Object.entries(shares).forEach(([n, v]) => {
                          if (!members.includes(n)) return;
                          const pct = Number(v);
                          if (pct === 0) nonParticipants.push(n);
                          else if (pct > 0 && pct < 100) partialParticipants.push({ name: n, pct });
                        });
                      }
                      const rUrl = receiptPublicUrl(tx.receipt_path, tx.updated_at || tx.created_at || tx.id);
                      return (
                        <div key={tx.id} className="px-3.5 py-3 flex items-center gap-3 group">
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className="font-semibold text-sm truncate">{tx.category}</span>
                              {tx.note && <span className="text-xs text-zinc-400 truncate">· {tx.note}</span>}
                              {rUrl && (
                                <button type="button" onClick={() => setPreviewReceipt(rUrl)}
                                  className="text-sky-500 shrink-0" title="查看收據"><Icons.Receipt /></button>
                              )}
                            </div>
                            <div className="flex items-center gap-1.5 mt-0.5 text-[11px] text-zinc-400 min-w-0 flex-wrap">
                              <span className="shrink-0">{tx.date}</span>
                              <span className="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-500 truncate max-w-[6rem]">{tx.payer}</span>
                              {nonParticipants.length > 0 && (
                                <span className="text-[10px] text-zinc-400">
                                  未參與：{nonParticipants.join('、')}
                                </span>
                              )}
                              {partialParticipants.length > 0 && (
                                <span className="text-[10px] text-sky-600 dark:text-sky-400">
                                  參與：{partialParticipants.map(p => `${p.name} ${p.pct}%`).join('、')}
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="text-right shrink-0">
                            <div className="font-mono font-semibold text-sm whitespace-nowrap">−{formatMoney(tx.amount, cur?.symbol || '')}</div>
                            {tx.currency !== displayCurKey && (
                              <div className="text-[10px] text-zinc-400 whitespace-nowrap">≈ {formatMoney(convertDisplay(tx.amount, tx.currency), displaySymbol)}</div>
                            )}
                          </div>
                          <div className="flex flex-col shrink-0 opacity-60 group-hover:opacity-100">
                            <button onClick={() => { setEditingTx(tx); setIsFormOpen(true); }} className="p-1 text-zinc-400 hover:text-zinc-900 dark:hover:text-white" aria-label="編輯"><Icons.Edit /></button>
                            <button onClick={() => deleteTx(tx.id)} className="p-1 text-zinc-400 hover:text-red-600" aria-label="刪除"><Icons.Trash /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            )}

            {tab === 'stats' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-4">
                  <MiniPie dataMap={byCategory} title="依類別" />
                </div>
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-4">
                  <MiniPie dataMap={byPayer} title="依付款人" />
                </div>
              </div>
            )}

            {tab === 'settle' && (
              <div className="space-y-4">
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-4">
                  <h3 className="text-sm font-semibold mb-3">每人淨額</h3>
                  <p className="text-xs text-zinc-500 mb-3">
                    共同支出總額 {formatMoney(settleCurMode === 'travel' ? convertDisplay(settlement.total, ledger.homeCurrency || 'HKD') : settlement.total, displaySymbol)}
                    {effectiveLoans.length > 0 && ` · 含 ${effectiveLoans.length} 筆私人借款`}
                    {skippedLoanCount > 0 && `（另 ${skippedLoanCount} 筆因非成員未計入）`}
                    （僅計算設定中的成員）
                  </p>
                  {settlement.orphanPaid > 0.01 && (
                    <p className="text-[11px] text-amber-600 dark:text-amber-400 mb-3">
                      有已移除成員的付款約 {formatMoney(convertDisplay(settlement.orphanPaid, ledger.homeCurrency || 'HKD'), displaySymbol)} 未計入其「已付」，費用仍由現有成員分攤。
                    </p>
                  )}
                  <div className="space-y-2">
                    {(settlement.nets || []).map(n => (
                      <div key={n.name} className="flex items-center justify-between text-sm">
                        <span className="font-medium">{n.name}</span>
                        <div className="text-right">
                          <div className="font-mono text-xs text-zinc-500">
                            已付 {formatMoney(convertDisplay(n.paid, ledger.homeCurrency || 'HKD'), displaySymbol)} · 應分攤 {formatMoney(convertDisplay(n.fair, ledger.homeCurrency || 'HKD'), displaySymbol)}
                            {Math.abs(n.loanAdj) > 0.01 && ` · 借款 ${formatMoney(convertDisplay(n.loanAdj, ledger.homeCurrency || 'HKD'), displaySymbol)}`}
                          </div>
                          <div className={`text-sm font-semibold ${n.net >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                            {n.net >= 0 ? '應收 ' : '應付 '}{formatMoney(Math.abs(convertDisplay(n.net, ledger.homeCurrency || 'HKD')), displaySymbol)}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-4">
                  <h3 className="text-sm font-semibold mb-3">建議轉帳</h3>
                  {(settlement.transfers || []).length === 0 ? (
                    <p className="text-sm text-zinc-400">目前帳目已平衡 🎉</p>
                  ) : (
                    <div className="space-y-2">
                      {settlement.transfers.map((t, i) => (
                        <div key={i} className="flex items-center gap-2 text-sm p-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-800/60">
                          <span className="font-medium">{t.from}</span>
                          <span className="text-zinc-400">→</span>
                          <span className="font-medium">{t.to}</span>
                          <span className="ml-auto font-mono font-semibold">{formatMoney(convertDisplay(t.amount, ledger.homeCurrency || 'HKD'), displaySymbol)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 計算過程表格（預設隱藏） */}
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 overflow-hidden">
                  <button type="button" onClick={() => setShowSettleSteps(s => !s)}
                    className="w-full flex items-center justify-between px-4 py-3 text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800/50">
                    <span>查看結算計算過程</span>
                    <Icons.Chevron open={showSettleSteps} />
                  </button>
                  {showSettleSteps && (
                    <div className="border-t border-zinc-100 dark:border-zinc-800 overflow-x-auto">
                      {(settlement.people || []).length === 0 ? (
                        <p className="px-4 py-6 text-center text-xs text-zinc-400">尚無資料</p>
                      ) : (
                        <table className="w-full text-xs border-collapse min-w-[280px]">
                          <thead>
                            <tr className="bg-amber-50/80 dark:bg-zinc-800/80">
                              <th className="text-left font-medium text-zinc-500 px-3 py-2.5 sticky left-0 bg-amber-50/80 dark:bg-zinc-800/80 border-b border-zinc-200 dark:border-zinc-700">項目</th>
                              {(settlement.people || []).map(p => (
                                <th key={p} className="text-right font-semibold text-zinc-700 dark:text-zinc-200 px-3 py-2.5 border-b border-zinc-200 dark:border-zinc-700 whitespace-nowrap">{p}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {(settlement.tableRows || []).map((row, i) => {
                              const isSum = row.kind === 'sum' || row.kind === 'net';
                              const isNet = row.kind === 'net';
                              const isLoan = row.kind === 'loan';
                              return (
                                <tr key={i} className={
                                  isNet ? 'bg-zinc-100 dark:bg-zinc-800 font-semibold' :
                                  isSum ? 'bg-zinc-50 dark:bg-zinc-900/60' :
                                  isLoan ? 'bg-amber-50/40 dark:bg-amber-950/20' : ''
                                }>
                                  <td className={`px-3 py-2 sticky left-0 border-b border-zinc-100 dark:border-zinc-800 ${isNet ? 'bg-zinc-100 dark:bg-zinc-800' : isSum ? 'bg-zinc-50 dark:bg-zinc-900/60' : isLoan ? 'bg-amber-50/40 dark:bg-amber-950/20' : 'bg-white dark:bg-zinc-900'}`}>
                                    <div className="font-medium text-zinc-700 dark:text-zinc-200 whitespace-nowrap">{row.label}</div>
                                    {row.sub && <div className="text-[10px] text-zinc-400 mt-0.5 max-w-[9rem] truncate">{row.sub}</div>}
                                  </td>
                                  {(settlement.people || []).map(p => {
                                    const v = (row.cells && row.cells[p]) || 0;
                                    const empty = Math.abs(v) < 0.005;
                                    let color = 'text-zinc-700 dark:text-zinc-300';
                                    if (isNet) color = v > 0.01 ? 'text-emerald-600' : v < -0.01 ? 'text-red-500' : 'text-zinc-500';
                                    else if (isLoan && !empty) color = v > 0 ? 'text-emerald-600' : 'text-red-500';
                                    return (
                                      <td key={p} className={`px-3 py-2 text-right font-mono border-b border-zinc-100 dark:border-zinc-800 whitespace-nowrap ${color}`}>
                                        {empty ? '—' : (v > 0 && isNet ? '+' : '') + formatMoney(convertDisplay(v, ledger.homeCurrency || 'HKD'), displaySymbol).replace(displaySymbol + ' ', '')}
                                      </td>
                                    );
                                  })}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      )}
                      <p className="px-3 py-2 text-[10px] text-zinc-400 border-t border-zinc-100 dark:border-zinc-800">
                        支出列＝該人應分攤金額 · 借款列＝淨額調整（借出＋／借入−）· 淨額＝已付 − 應分攤 ＋ 借款調整
                      </p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === 'loans' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <p className="text-xs text-zinc-500 leading-relaxed">
                    成員之間的私人借款，會併入結算淨額。<br/>
                    <span className="text-amber-600 dark:text-amber-400">如果借款人或出借人不是成員之一，只會當普通記錄，不會入結算。</span>
                  </p>
                  <button type="button" onClick={() => { setEditingLoan(null); setIsLoanFormOpen(true); }}
                    className="text-xs px-3 py-1.5 rounded-lg bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-medium">
                    + 新增借款
                  </button>
                </div>
                {loans.length === 0 ? (
                  <div className="py-12 text-center text-zinc-400 text-sm">尚無私人借款</div>
                ) : (
                  <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 divide-y divide-zinc-100 dark:divide-zinc-800 overflow-hidden">
                    {loans.map(l => {
                      const cur = CURRENCIES.find(c => c.key === l.currency);
                      return (
                        <div key={l.id} className="px-3.5 py-3 flex items-center gap-3">
                          <div className="w-9 h-9 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
                            <Icons.Loan />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-sm font-medium">
                              <span className="text-red-500">{l.from_member}</span>
                              <span className="text-zinc-400 mx-1">向</span>
                              <span className="text-emerald-600">{l.to_member}</span>
                              <span className="text-zinc-400 ml-1">借</span>
                            </div>
                            <div className="text-[11px] text-zinc-400 mt-0.5">
                              {l.date}{l.note ? ` · ${l.note}` : ''}
                            </div>
                          </div>
                          <div className="text-right shrink-0">
                            <div className="font-mono font-semibold text-sm">{formatMoney(l.amount, cur?.symbol || '')}</div>
                            {l.currency !== displayCurKey && (
                              <div className="text-[10px] text-zinc-400">≈ {formatMoney(convertDisplay(l.amount, l.currency), displaySymbol)}</div>
                            )}
                          </div>
                          <div className="flex flex-col shrink-0">
                            <button onClick={() => { setEditingLoan(l); setIsLoanFormOpen(true); }} className="p-1 text-zinc-400 hover:text-zinc-900" aria-label="編輯"><Icons.Edit /></button>
                            <button onClick={() => deleteLoan(l.id)} className="p-1 text-zinc-400 hover:text-red-600" aria-label="刪除"><Icons.Trash /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            <p className="text-center text-xs text-zinc-400 pt-6 pb-2">
              資料存於本機 + Supabase · {statusText || (online ? '就緒' : '離線模式')}
            </p>
          </main>

          {/* FAB：明細頁新增支出；借款頁新增借款 */}
          {tab !== 'loans' ? (
            <button onClick={() => { setEditingTx(null); setIsFormOpen(true); }}
              className="safe-bottom-fab fixed right-6 md:right-8 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 p-4 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-transform z-40"
              title="新增支出" aria-label="新增支出">
              <Icons.Plus />
            </button>
          ) : (
            <button onClick={() => { setEditingLoan(null); setIsLoanFormOpen(true); }}
              className="safe-bottom-fab fixed right-6 md:right-8 bg-amber-500 text-white p-4 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-transform z-40"
              title="新增借款" aria-label="新增借款">
              <Icons.Plus />
            </button>
          )}

          {isFormOpen && (
            <TxForm initial={editingTx} members={members.length ? members : [ledger.myName]}
              travelCurrency={ledger.travelCurrency || 'JPY'}
              onSave={saveTx} onClose={() => { setIsFormOpen(false); setEditingTx(null); }} />
          )}
          {isLoanFormOpen && (
            <LoanForm initial={editingLoan} members={members.length ? members : [ledger.myName]}
              travelCurrency={ledger.travelCurrency || 'JPY'}
              onSave={saveLoan} onClose={() => { setIsLoanFormOpen(false); setEditingLoan(null); }} />
          )}
          {isSettingsOpen && (
            <SettingsModal settings={ledger} members={members}
              onSave={handleSaveSettings}
              onClose={() => setIsSettingsOpen(false)}
              onLeave={handleClearLedger} />
          )}
          {previewReceipt && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4"
              onClick={() => setPreviewReceipt(null)}>
              <div className="relative max-w-full max-h-[85vh] flex flex-col items-center" onClick={e => e.stopPropagation()}>
                <img src={previewReceipt} alt="收據" className="max-w-full max-h-[80vh] object-contain rounded-lg" />
                <button type="button" onClick={() => setPreviewReceipt(null)}
                  className="mt-3 text-white bg-black/70 hover:bg-black/90 px-5 py-2 rounded-full text-sm font-medium shadow-lg">
                  關閉
                </button>
                <button type="button" onClick={() => setPreviewReceipt(null)}
                  className="absolute -top-2 -right-2 w-9 h-9 rounded-full bg-black/70 text-white text-lg leading-none flex items-center justify-center shadow"
                  aria-label="關閉">×</button>
              </div>
            </div>
          )}
          {toast && <Toast {...toast} onClose={() => setToast(null)} />}
        </div>
      );
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.info('[Travel Ledger] SW registered', reg.scope))
          .catch(err => console.warn('[Travel Ledger] SW failed', err));
      });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
